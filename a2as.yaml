manifest:
  version: "0.1.3"
  schema: https://a2as.org/cert/schema
  subject:
    name: preethicoder/trip_planner_google_adk
    source: https://github.com/preethicoder/trip_planner_google_adk
    branch: main
    commit: "e6592323"
    scope: [agents/itinerary_agent.py, agents/root_agent.py, agents/simple_planner.py, app.py, runner.py, tools/travel_tools.py]
  issued:
    by: A2AS.org
    at: '2026-02-11T16:57:27Z'
    url: https://a2as.org/certified/agents/preethicoder/trip_planner_google_adk
  signatures:
    digest: sha256:klo28TMIQIbj89QaCyWwb09iLgp2SY7naRZaxNZN4tY
    key: ed25519:OrqWlp23Xn2Mgq-hOBNrPd5Z_mbbK63lFS_Hr4qNupc
    sig: ed25519:RDNrj3vRTlPBweXhfBQR1aecDyWYgwV-yQhbuZkCcj0PONJp8BAoKaCYe_h03LBkjcv5QzH6YCulKPL_kchXBg

agents:
  ITINERARY_SEARCH_AGENT:
    type: instance
    models: [gemini-2.5-pro]
    tools: [google_search]
    params:
      name: ItinerarySearchAgent
      description: Agent that searches for and structures travel itineraries using Google Search.
      instruction: ['# Itinerary Search Agent', You are a travel itinerary specialist. Your job is to use Google Search to
          find comprehensive itinerary information for a destination., '## Your Task', 'When given a city and trip duration:',
        1. Use google_search to find detailed itinerary information for that destination, '2. Search for popular attractions,
          restaurants, and activities', 3. Structure the results into a detailed day-by-day plan, '## Output Format', 'Structure
          your response as a clear day-by-day itinerary:', '**Day 1: [Theme]**', '- Morning: [Activity/Attraction]', '- Afternoon:
          [Activity/Attraction]', '- Evening: [Activity/Attraction]', '**Day 2: [Theme]**', "...", 'Include specific attraction
          names, recommended times, and practical tips from your search results.']
  SIMPLE_TRIP_PLANNER:
    type: instance
    models: [gemini-2.5-pro]
    tools: [flight_search, hotel_search, itinerary_generator]
    params:
      name: SimpleTripPlanner
      description: Trip planner with flight, hotel, and itinerary tools.
      instruction: ['# Trip Planner Agent', You are a professional trip planning assistant with access to real-time flight
          and hotel search APIs., '## Your Task', 'For every trip request, you MUST call these tools IN ORDER:', 1. **flight_search**
          - Get real flight options, '- originLocationCode: 3-letter code (Chennai=MAA, Basel=BSL)', '- destinationLocationCode:
          3-letter code', '- departureDate: YYYY-MM-DD', '- adults: number', 2. **hotel_search** - Get real hotel options,
        '- cityCode: 3-letter code', '- check_in: YYYY-MM-DD (use underscore!)', '- check_out: YYYY-MM-DD (use underscore!)',
        '- max_budget: 300.0', '- adults: number of adult guests (e.g., 2)', 3. **itinerary_generator** - Signal for itinerary
          creation, '- city: destination name', '- trip_length_days: number of days', '## Rules', '- Call ALL three tools
          for EVERY trip request', '- Use EXACT parameter names', '- Never skip tools or make up data', '- Present the flight
          and hotel results clearly']

models:
  gemini-2.5-pro:
    type: literal
    agents: [SIMPLE_TRIP_PLANNER, ITINERARY_SEARCH_AGENT]

tools:
  flight_search:
    type: function
    agents: [SIMPLE_TRIP_PLANNER]
    params:
      description: |-
        Search for flight options using Amadeus API.

        Args:
            originLocationCode: 3-letter IATA code (e.g., MAA for Chennai)
            destinationLocationCode: 3-letter IATA code (e.g., BSL for Basel)
            departureDate: Date in YYYY-MM-DD format
            adults: Number of adult passengers
  google_search:
    type: module
    agents: [ITINERARY_SEARCH_AGENT]
  hotel_search:
    type: function
    agents: [SIMPLE_TRIP_PLANNER]
    params:
      description: |-
        Search for hotel options using Amadeus API.

        Args:
            cityCode: 3-letter IATA city code
            check_in: Check-in date in YYYY-MM-DD format
            check_out: Check-out date in YYYY-MM-DD format
            max_budget: Maximum price per night in EUR
            adults: Number of adult guests (default: 2)
  itinerary_generator:
    type: function
    agents: [SIMPLE_TRIP_PLANNER]
    params:
      description: |-
        Generate a structured itinerary for the trip.

        Args:
            city: Destination city name
            trip_length_days: Number of days for the trip

imports:
  Any: typing.Any
  BaseModel: pydantic.BaseModel
  BaseTool: google.adk.tools.BaseTool
  date: datetime.date
  Dict: typing.Dict
  Field: pydantic.Field
  FLIGHT_TOOL: tools.travel_tools.FLIGHT_TOOL
  FlightSearchResult: schemas.FlightSearchResult
  google_search: google.adk.tools.google_search
  HOTEL_TOOL: tools.travel_tools.HOTEL_TOOL
  HotelSearchResult: schemas.HotelSearchResult
  InMemorySessionService: google.adk.sessions.InMemorySessionService
  ITINERARY_SEARCH_AGENT: agents.itinerary_agent.ITINERARY_SEARCH_AGENT
  ITINERARY_TOOL: tools.travel_tools.ITINERARY_TOOL
  ItineraryPlanResult: schemas.ItineraryPlanResult
  List: typing.List
  LlmAgent: google.adk.agents.LlmAgent
  load_dotenv: dotenv.load_dotenv
  Optional: typing.Optional
  os: os
  random: random
  requests: requests
  ROOT_AGENT: agents.root_agent.ROOT_AGENT
  Runner: google.adk.Runner
  Session: google.adk.sessions.Session
  SIMPLE_TRIP_PLANNER: simple_planner.SIMPLE_TRIP_PLANNER
  st: streamlit
  timedelta: datetime.timedelta
  types: google.genai.types

functions:
  _get_access_token:
    type: sync
    module: tools.travel_tools
    params:
      returns: str
  _get_hotel_ids:
    type: sync
    module: tools.travel_tools
    args: [self, cityCode]
    params:
      returns: List[str]
  _get_hotel_offers:
    type: sync
    module: tools.travel_tools
    args: [self, hotel_ids, check_in, check_out, adults]
    params:
      returns: HotelSearchResult
  flight_search:
    type: sync
    module: agents.simple_planner
    args: [originLocationCode, destinationLocationCode, departureDate, adults]
  hotel_search:
    type: sync
    module: agents.simple_planner
    args: [cityCode, check_in, check_out, max_budget, adults]
  itinerary_generator:
    type: sync
    module: agents.simple_planner
    args: [city, trip_length_days]
  run:
    type: sync
    module: tools.travel_tools
    args: [self, city, trip_length_days]
    params:
      returns: str
  run_trip_planner:
    type: sync
    module: runner
  setup_environment:
    type: sync
    module: runner

variables:
  AMADEUS_API_KEY:
    type: env
    params:
      caller: [os.getenv, os.environ]
      path: [runner, tools.travel_tools]
  AMADEUS_API_SECRET:
    type: env
    params:
      caller: [os.getenv, os.environ]
      path: [runner, tools.travel_tools]
  GOOGLE_API_KEY:
    type: env
    params:
      caller: [os.getenv, os.environ]
      path: [app, runner]

networks:
  test.api.amadeus.com:
    type: api
    actions: [POST, GET]
    urls: [/v1/security/oauth2/token, /v2/shopping/flight-offers, /v1/reference-data/locations/hotels/by-city, /v3/shopping/hotel-offers]
    protocols: [https]
    ports: ["443"]
    params:
      caller: [_get_access_token, run, _get_hotel_ids, _get_hotel_offers]
